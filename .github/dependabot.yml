version: 2
updates:
  # Docs site (Astro/Starlight) npm dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(actions)"

  # Terraform providers/modules (alternate IaC track)
  - package-ecosystem: terraform
    directory: "/infra/terraform"
    schedule:
      interval: weekly
    labels: ["dependencies", "terraform"]
    commit-message:
      prefix: "chore(tf)"

  # Dev container features
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "devcontainer"]
