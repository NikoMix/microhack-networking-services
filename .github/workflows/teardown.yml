name: Teardown

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to confirm resource-group teardown'
        type: string
        required: true
      noWait:
        description: "Don't wait for deletes to finish"
        type: boolean
        default: true

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: teardown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  teardown:
    name: Delete CFS resource groups (OIDC)
    runs-on: ubuntu-latest
    environment: lab
    steps:
      - uses: actions/checkout@v7

      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "Confirmation failed: type DELETE to proceed." >&2
            exit 1
          fi

      - name: Azure login (OIDC — no secrets)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Teardown resource groups
        run: |
          chmod +x infra/scripts/teardown.sh
          if [ "${{ inputs.noWait }}" = "true" ]; then
            infra/scripts/teardown.sh --confirm DELETE --no-wait
          else
            infra/scripts/teardown.sh --confirm DELETE
          fi
