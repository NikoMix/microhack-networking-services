name: Deploy

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Staged component to deploy (run 'gateway' FIRST — it takes 30-45 min)"
        type: choice
        default: all
        options:
          - all
          - gateway
          - hub
          - spoke
          - edge
      location:
        description: "Azure region"
        type: string
        default: swedencentral
      whatIfOnly:
        description: "Run what-if preview only (no deploy)"
        type: boolean
        default: false

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: What-if & deploy (OIDC)
    runs-on: ubuntu-latest
    environment: lab
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC — no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install

      - name: What-if (subscription scope)
        run: |
          az deployment sub what-if \
            --name "cfs-network-${{ inputs.component }}-${{ github.run_id }}" \
            --location "${{ inputs.location }}" \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/lab.bicepparam \
            --parameters deploymentComponent="${{ inputs.component }}"

      - name: Deploy
        if: ${{ inputs.whatIfOnly == false }}
        run: |
          az deployment sub create \
            --name "cfs-network-${{ inputs.component }}-${{ github.run_id }}" \
            --location "${{ inputs.location }}" \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/lab.bicepparam \
            --parameters deploymentComponent="${{ inputs.component }}"

      - name: Show outputs
        if: ${{ inputs.whatIfOnly == false }}
        run: |
          az deployment sub show \
            --name "cfs-network-${{ inputs.component }}-${{ github.run_id }}" \
            --query properties.outputs --output jsonc

      - name: Approve Front Door -> App Gateway Private Link
        if: ${{ inputs.whatIfOnly == false && (inputs.component == 'all' || inputs.component == 'edge') }}
        run: |
          AGW_ID="$(az deployment sub show \
            --name "cfs-network-${{ inputs.component }}-${{ github.run_id }}" \
            --query "properties.outputs.applicationGatewayResourceId.value" --output tsv)"
          if [ -z "$AGW_ID" ]; then echo "No Application Gateway in this deployment — skipping."; exit 0; fi
          for _ in $(seq 1 10); do
            PENDING="$(az network private-endpoint-connection list --id "$AGW_ID" \
              --query "[?properties.privateLinkServiceConnectionState.status=='Pending'].id" --output tsv 2>/dev/null || true)"
            if [ -n "$PENDING" ]; then
              while IFS= read -r CONN; do
                [ -z "$CONN" ] && continue
                az network private-endpoint-connection approve --id "$CONN" \
                  --description 'Approved by deploy workflow (Front Door Premium origin)' --output none
                echo "Approved: $CONN"
              done <<< "$PENDING"
              exit 0
            fi
            sleep 15
          done
          echo "No pending connection found yet; if the Front Door origin shows unapproved, re-run this step."
