name: Deploy

on:
  workflow_dispatch:
    inputs:
      location:
        description: "Azure region"
        type: string
        default: swedencentral
      whatIfOnly:
        description: "Run what-if preview only (no deploy)"
        type: boolean
        default: false

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: What-if & deploy (OIDC)
    runs-on: ubuntu-latest
    environment: lab
    steps:
      - uses: actions/checkout@v5

      - name: Azure login (OIDC — no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep CLI
        run: az bicep install

      - name: What-if (subscription scope)
        run: |
          az deployment sub what-if \
            --name "cfs-network-${{ github.run_id }}" \
            --location "${{ inputs.location }}" \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/lab.bicepparam

      - name: Deploy
        if: ${{ inputs.whatIfOnly == false }}
        run: |
          az deployment sub create \
            --name "cfs-network-${{ github.run_id }}" \
            --location "${{ inputs.location }}" \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/lab.bicepparam

      - name: Show outputs
        if: ${{ inputs.whatIfOnly == false }}
        run: |
          az deployment sub show \
            --name "cfs-network-${{ github.run_id }}" \
            --query properties.outputs --output jsonc
