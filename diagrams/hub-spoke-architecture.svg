<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="800" viewBox="0 0 1200 800">

  <!-- Background -->
  <rect width="1200" height="800" fill="#F0F4FF" rx="12"/>

  <!-- Top bar -->
  <rect width="1200" height="80" fill="#0070C0" rx="12"/>
  <rect y="68" width="1200" height="12" fill="#0070C0"/>

  <!-- Title -->
  <text x="600" y="35" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="bold"
        fill="white" text-anchor="middle" dominant-baseline="middle">CFS Hub &amp; Spoke Network Architecture</text>
  <text x="600" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="12"
        fill="#AACCFF" text-anchor="middle" dominant-baseline="middle">Control: B.3.1 / B.3.2 | Region: swedencentral | ALZ Hub &amp; Spoke topology</text>

  <!-- Icon grid background -->
  <rect x="40" y="110" width="1120" height="600" fill="white" rx="8" stroke="#DDEEFF" stroke-width="1"/>

  <!-- Architecture diagram reference note -->
  <rect x="200" y="200" width="800" height="300" fill="#E6F3FF" rx="10" stroke="#0070C0" stroke-width="2"/>

  <text x="600" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold"
        fill="#003087" text-anchor="middle">Architecture Diagram</text>

  <!-- Drawio icon (simplified) -->
  <rect x="540" y="295" width="120" height="80" fill="#FF8000" rx="6"/>
  <text x="600" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="bold"
        fill="white" text-anchor="middle" dominant-baseline="middle">&#x25FC;</text>

  <text x="600" y="405" font-family="Segoe UI, Arial, sans-serif" font-size="14"
        fill="#0070C0" text-anchor="middle">Open: hub-spoke-architecture.drawio</text>
  <text x="600" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="12"
        fill="#666666" text-anchor="middle">View in draw.io, VS Code (draw.io extension), or</text>
  <text x="600" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="12"
        fill="#666666" text-anchor="middle">diagrams.net to render the full interactive diagram.</text>
  <text x="600" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="12"
        fill="#666666" text-anchor="middle">Mermaid source: diagrams/mermaid/hub-spoke-architecture.mmd</text>

  <!-- CFS branding -->
  <rect x="40" y="730" width="1120" height="50" fill="#1F3864" rx="0 0 8 8"/>
  <text x="600" y="758" font-family="Segoe UI, Arial, sans-serif" font-size="11"
        fill="#AABBCC" text-anchor="middle">
    Contoso Financial Services (CFS) | Module B Evidence | Azure Networking Microhack | Train-the-Trainer
  </text>

  <!-- Watermark note -->
  <text x="600" y="795" font-family="Segoe UI, Arial, sans-serif" font-size="9"
